<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F9F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fluency">
<title>Fluency Rank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="intro" hidden aria-hidden="true">
  <div class="intro-orb"><div class="intro-petals"><span></span><span></span><span></span><span></span></div><div class="intro-core"></div></div>
  <p class="intro-word" id="introWord">Take a breath</p>
  <p class="intro-skip">Tap anywhere to enter</p>
</div>
<div id="app">
  <div id="notice" role="alert" hidden></div>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Sections"><div class="in">
  <button type="button" data-act="tab" data-v="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/></svg>Home</button>
  <button type="button" data-act="tab" data-v="breathe"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/><path d="M3 14c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/><path d="M3 19c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/></svg>Breathe</button>
  <!-- the Speak tab keeps the internal id "gates" so older tests and links still reach it -->
  <button type="button" data-act="tab" data-v="gates"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4.4A8 8 0 1 1 20.5 11.5z"/></svg>Speak</button>
  <button type="button" data-act="tab" data-v="progress"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7"/><path d="M12 20V5"/><path d="M19 20v-10"/><path d="M3 20.5h18"/></svg>Progress</button>
</div></nav>
<div id="scrim" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <header class="sh-h"><h2 id="sheetTitle" tabindex="-1">Settings</h2><button type="button" class="lnk" data-act="sheetDone">Done</button></header>
  <div id="sheetBody"></div>
</section>
<div id="run" role="dialog" aria-modal="true" aria-labelledby="runTitle" hidden>
  <header class="run-h"><h1 id="runTitle" tabindex="-1"></h1><button type="button" class="lnk" id="snd" aria-pressed="false">Sound off</button></header>
  <div id="runBody"></div>
  <footer class="run-f" id="runFoot"></footer>
</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
