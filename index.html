<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b101b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fluency">
<title>Fluency Rank System</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/*
  Direction: a ranked status sheet, not a dashboard of cards.
  Sections are ruled, not boxed. Numbers are tabular. Only the run panel and
  the system notice get corner brackets. Colour carries meaning:
  steel = system chrome, amber = progress, e1..e5 = how tired you were.
*/
:root{
  --ink:#0b101b;
  --slate:#121a2a;
  --rule:#27344b;
  --steel:#7db4f0;
  --amber:#e9b44c;
  --text:#e8edf5;
  --mute:#97a6bf;
  --ok:#5fcf9a;
  --warn:#f08a5d;
  --e1:#5f8fc9;--e2:#63a7a8;--e3:#a8b56f;--e4:#e0a94a;--e5:#e07a4a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.5 var(--f-body)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.note{font-size:14px;color:var(--mute)}
.note b{color:var(--text);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.brand small{font:400 12px var(--f-mono);color:var(--mute);text-align:right}
#notice{border:1px solid var(--warn);color:var(--text);padding:10px 12px;font-size:14px;margin-bottom:16px}
#notice[hidden]{display:none}
#view{display:flex;flex-direction:column;gap:28px}

/* ruled section */
.blk{display:flex;flex-direction:column;gap:12px}
.blk>.lbl{padding-top:12px;border-top:1px solid var(--rule)}
.lbl{margin:0;font:600 14px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--steel)}
h2.q{font:600 28px/1.2 var(--f-display)}
h2.t{font:600 24px/1.2 var(--f-display)}

/* bracketed panels: used sparingly */
.panel{position:relative;background:var(--slate);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--steel);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

/* buttons */
.btn{min-height:46px;padding:10px 18px;background:transparent;border:1px solid var(--steel);color:var(--steel);font:600 16px var(--f-display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:rgba(125,180,240,.1)}
.btn.solid{background:var(--steel);color:#08111e}
.btn.solid:hover{background:#97c4f5}
.btn.sm{min-height:44px;padding:6px 14px;font-size:14px}
.btn.xl{min-height:88px;width:100%;font-size:28px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.amber{border-color:var(--amber);color:var(--amber)}
.btn.link{border:0;min-height:44px;padding:0 4px;text-decoration:underline;text-transform:none;letter-spacing:0;font:500 15px var(--f-body)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* segmented choices */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{flex:1 1 0;min-width:52px;min-height:52px;padding:6px 8px;background:transparent;border:1px solid var(--rule);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.segb b{font:600 18px var(--f-display);letter-spacing:.04em}
.segb span{font-size:11px;color:var(--mute)}
.segb.wide{flex-basis:100%;flex-direction:row;justify-content:space-between;padding:10px 14px;text-align:left;gap:12px}
.segb[aria-pressed=true]{border-color:var(--steel);background:rgba(125,180,240,.14);box-shadow:inset 0 0 0 1px var(--steel)}
.segb[aria-pressed=true] span{color:var(--text)}

/* status head */
.head{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.rank{--c:#7f93b3;width:92px;height:104px;background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center}
.rank i{width:84px;height:96px;background:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font:700 52px/1 var(--f-display);font-style:normal;color:var(--c)}
.rE{--c:#8197b8}.rD{--c:#5fcf9a}.rC{--c:#7db4f0}.rB{--c:#a99bf0}.rA{--c:#f08a5d}.rS{--c:#e9b44c}
.led{display:flex;flex-direction:column}
.led>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.led>div:first-child{border-top:0}
.led b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#0a0f19;border:1px solid var(--rule)}
.bar>i{display:block;height:100%;background:var(--amber)}
.bar.steel>i{background:var(--steel)}

/* quests, stats */
.quests>li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.quests small{display:block;color:var(--mute);font-size:13px}
.quests b{font:600 17px var(--f-display);letter-spacing:.04em}
.chk{width:20px;height:20px;border:1px solid var(--mute);display:block;position:relative}
.ok .chk{background:var(--ok);border-color:var(--ok)}
.ok .chk::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #08111e;border-width:0 2px 2px 0;transform:rotate(45deg)}
.stat{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.stat .mono{font-size:12px;color:var(--mute);text-align:right}

/* week strip and mosaic */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk{height:34px;border:1px solid var(--rule);display:grid;place-items:center;font:500 11px var(--f-mono);color:var(--mute)}
.wk.on{background:var(--steel);border-color:var(--steel);color:#08111e}
.wk.today{outline:1px solid var(--amber);outline-offset:1px}
.mosaic{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.cell{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--rule);font:400 10px var(--f-mono);color:#566685}
.cell.f{border-color:transparent;color:#08111e;font-weight:500}
.e1{background:var(--e1)}.e2{background:var(--e2)}.e3{background:var(--e3)}.e4{background:var(--e4)}.e5{background:var(--e5)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}

/* gate list */
.grow{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 0;border-top:1px solid var(--rule);align-items:center}
.grow h3{font:600 20px var(--f-display);letter-spacing:.04em}
.grow .xpr{font:400 12px var(--f-mono);color:var(--amber);grid-column:1}
.grow p{grid-column:1;font-size:14px;color:var(--mute)}
.grow .btn{grid-column:2;grid-row:1/4}
.grow.locked{opacity:.55}

/* log */
.erow{display:grid;grid-template-columns:96px 1fr 40px;gap:12px;align-items:center;font-size:13px;padding:5px 0}
.erow .mono{color:var(--mute);text-align:right;font-size:12px}
.loglist>li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}
.loglist small{grid-column:1/-1;color:var(--mute);overflow-wrap:anywhere}
.loglist .xp{font:400 13px var(--f-mono);color:var(--amber)}

/* guide and forms */
.guide li{padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.guide li b{font:600 17px var(--f-display);letter-spacing:.04em;color:var(--steel)}
.lab{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
input[type=text],textarea,select{width:100%;background:#0a0f19;border:1px solid var(--rule);padding:10px 12px;border-radius:0;font-size:16px}
textarea{min-height:92px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--steel);min-height:32px}
.tg{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-size:15px}
.tg input{width:22px;height:22px;accent-color:var(--steel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:4px 10px;border:1px solid var(--rule);color:var(--mute)}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{display:flex;max-width:560px;margin:0 auto}
#tabs button{flex:1;min-height:60px;background:transparent;border:0;border-top:3px solid transparent;color:var(--mute);font:600 15px var(--f-display);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
#tabs button[aria-current=page]{color:var(--steel);border-top-color:var(--steel)}

/* drill overlay */
#run{position:fixed;inset:0;z-index:20;background:var(--ink);overflow:auto;display:none}
.run-in{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.run-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.run-h h1{font-size:18px;letter-spacing:.14em;text-transform:uppercase;flex:1;min-width:0}
#runBody{display:flex;flex-direction:column;gap:16px}
#runBody h2:focus{outline:none}
.orb{width:230px;height:230px;border-radius:50%;margin:8px auto;border:3px solid var(--steel);background:rgba(125,180,240,.08);display:grid;place-items:center;transform:scale(.6);padding:22px;text-align:center}
.orb .phase{font:600 26px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.orb .sub{font-size:14px;margin-top:6px;min-height:42px}
.pc-meta{display:flex;justify-content:space-between;font:400 13px var(--f-mono);color:var(--mute)}
.big{font:700 120px/1 var(--f-display);color:var(--steel);text-align:center}
.count{font:700 80px/1 var(--f-display);text-align:center}
.clock{font:500 30px var(--f-mono);color:var(--amber);text-align:center;min-height:45px}
.reader{font-size:22px;line-height:1.9}
.w{color:var(--mute);padding:0 1px}
.w.done{color:var(--text)}
.w.now{background:var(--steel);color:#08111e}
.w.c::after,.w.s::after{content:"\25BE";font-size:12px;color:var(--amber);margin-left:2px;vertical-align:super}
.skel{border-left:2px solid var(--steel);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px;font-size:15px}
.skel b{color:var(--steel);font-weight:600}
.phaseline{display:flex;justify-content:space-between;align-items:baseline;font:600 20px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.xp{font:700 44px/1 var(--f-display);color:var(--amber)}
.rlabel{font-size:15px;margin-bottom:6px}
.twist{border-left:3px solid var(--amber);padding:4px 0 4px 12px}
.center{text-align:center}

/* toasts and system notice */
#toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top));z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--slate);border:1px solid var(--steel);padding:8px 14px;font:400 13px var(--f-mono)}
#modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,14,.86);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.modal-in{max-width:420px;width:100%}

@media (max-width:420px){
  .stat{grid-template-columns:104px 1fr 40px}
  .big{font-size:96px}
  .orb{width:210px;height:210px}
  .head{grid-template-columns:80px 1fr}
  .rank{width:80px;height:92px}
  .rank i{width:73px;height:85px;font-size:44px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="brand"><h1>Fluency Rank System</h1><small id="sync" role="status">Saved on this device</small></header>
  <div id="notice" role="alert" hidden></div>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Sections"><div class="in">
  <button type="button" data-act="tab" data-v="status">Status</button>
  <button type="button" data-act="tab" data-v="gates">Gates</button>
  <button type="button" data-act="tab" data-v="log">Log</button>
  <button type="button" data-act="tab" data-v="guide">Guide</button>
</div></nav>
<div id="run" role="dialog" aria-modal="true" aria-labelledby="runTitle">
  <div class="run-in">
    <header class="run-h"><h1 id="runTitle" tabindex="-1"></h1><button type="button" class="btn sm" id="snd" aria-pressed="false">Sound off</button><button type="button" class="btn sm" id="abort">Exit</button></header>
    <div id="runBody"></div>
  </div>
</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
